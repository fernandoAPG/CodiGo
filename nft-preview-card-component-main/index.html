<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="images/image-equilibrium.jpg" alt="image-equilibrium" class="main-image">
    <h2>Equilibrium #3429</h2>

    <p>Our Equilibrium collection promotes balance and calm.</p>
    <div class="extra-info">
      <img src="images/icon-ethereum.svg" alt="icon-ethereum"><span>0.041 ETH</span>
      <img src="images/icon-clock.svg" alt="icon-clock"><span>3 days left</span>
    </div>
    <hr>
    <div class="autor-info">
    <img src="images/image-avatar.png" alt="image-avatar" class="avatar"><p>Creation of <span class="autorname">Jules Wyvern</span></p>
  </div>
  </div>

    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>-->
</body>

</html>
